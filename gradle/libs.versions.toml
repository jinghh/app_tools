[versions]
# AGP 8.13 为成熟稳定线（2025）；若后续升级 AGP 9.x 需评估其 built-in Kotlin 变更
agp = "8.13.0"
kotlin = "2.3.20"
# Compose 编译器已内置于 Kotlin 插件（org.jetbrains.kotlin.plugin.compose）
# BOM 固定 2025.10.00：更新的 BOM（2026.09.00 → compose 1.12.1）要求 AGP 9.1.0+ 与
# compileSdk 37，本机 SDK 最高 36.1，故锁定兼容组合（compose 1.9.3 / material3 1.4.0，
# 要求 AGP 8.6+ / compileSdk 35，已验证 aar-metadata）
composeBom = "2025.10.00"
activityCompose = "1.13.0"
coroutines = "1.10.2"
# androidx.core：NotificationCompat / ServiceCompat / ContextCompat 所需（前台服务与通知）。
# 版本与构建中已解析的传递依赖版本一致（1.18.0），不引入任何升级风险
coreKtx = "1.18.0"
# lifecycle-runtime-compose：界面生命周期感知（从系统设置返回时刷新通知权限状态）。
# 同样与构建中已解析的传递版本一致（2.9.4）
lifecycleRuntimeCompose = "2.9.4"
# Media3 1.11.1：2026-09-10 发布，minSdk 23
media3 = "1.11.1"
# FFmpegKit 社区维护分支（dev.ffmpegkit-maintained），仅发布 arm64-v8a / x86_64
# 注意：官方 com.arthenica 已于 2025 年退役并下架，禁止使用
# 纯 Java 备选（square/gifencoder）已实测弃用：同参数慢 29 倍、无法减色，不再引入
ffmpegKit = "8.1.9"
# yt-dlp-android（同维护方）：内嵌 CPython 3.13（Chaquopy 17），MIT，minSdk 24，
# 仅 arm64-v8a/x86_64，16KB 页对齐已核实；AAR 21.75MB（解压 60-80MB）
ytdlp = "2.0.2"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleRuntimeCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
androidx-compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
# BOM 托管版本（不写 version.ref）
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
ffmpeg-kit-min = { group = "dev.ffmpegkit-maintained", name = "ffmpeg-kit-min", version.ref = "ffmpegKit" }
ytdlp-android = { group = "dev.ffmpegkit-maintained", name = "yt-dlp-android", version.ref = "ytdlp" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
