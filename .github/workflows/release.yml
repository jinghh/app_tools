name: Build APK and Release

# 触发方式：
#   1) 推送形如 v0.1.0 的 tag  → 构建并创建 Release（附带 APK，可直接下载安装）
#   2) 手动触发（Actions 页面 Run workflow）→ 仅构建并上传为 artifact
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # GitHub 的 ubuntu 运行器自带 Android SDK，直接复用（不再依赖第三方 setup action）
      - name: Configure Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "使用 SDK 路径: $SDK_ROOT"
          ls "$SDK_ROOT" || true
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      # 项目 compileSdk 为 36，需要对应 platform 与 build-tools
      - name: Install SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"
          sdkmanager --list_installed | head -20 || true

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/libs.versions.toml', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Collect APK
        run: |
          mkdir -p artifacts
          NAME="my-app-tools-${GITHUB_REF_NAME:-manual}"
          cp app/build/outputs/apk/debug/app-debug.apk "artifacts/${NAME}.apk"
          ls -lh artifacts

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: artifacts/*.apk
          retention-days: 30

      # 仅 tag 触发时创建 Release，APK 会出现在 Releases 页面供直接下载
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          body: |
            由 GitHub Actions 自动构建的 **Debug 签名** APK。

            - 适用设备：arm64-v8a（近几年所有真实手机），Android 7.0（API 24）及以上
            - 安装方式：下载后传到手机点击安装；或用 `adb install -r <apk>`
            - 注意：Debug 签名仅便于自用安装，不适合上架应用商店
